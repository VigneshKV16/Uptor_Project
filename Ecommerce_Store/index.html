<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mega Mart | Consumer Electronics</title>
    <meta
      name="description"
      content="Shop the latest consumer electronics at Mega Mart."
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="images/fav_icon.jpg" type="image/jpeg" />
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-container">
        <a href="#/" class="logo"
          ><img src="images/Logo_450.png" alt="Mega Mart" height="65"
        /></a>

        <button
          class="mobile-menu-btn"
          id="mobile-menu-btn"
          aria-label="Toggle Navigation"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>

        <ul class="nav-links" id="nav-links">
          <li><a href="#/" class="nav-link">Home</a></li>
          <li><a href="#/products" class="nav-link">Shop</a></li>
        </ul>

        <div class="nav-actions">
          <a href="#/cart" class="cart-icon" aria-label="Cart">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="9" cy="21" r="1"></circle>
              <circle cx="20" cy="21" r="1"></circle>
              <path
                d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"
              ></path>
            </svg>
            <span class="cart-count" id="cart-count">0</span>
          </a>
        </div>
      </div>
    </nav>

    <main id="app-container"></main>

    <footer class="footer">
      <div class="footer-container">
        <div class="footer-brand">
          <img
            src="images/Logo_450.png"
            alt="Mega Mart"
            height="90"
            style="margin-bottom: var(--spacing-sm)"
          />
          <p>Your one-stop shop for the latest electronics.</p>
        </div>
        <div class="footer-links">
          <h4>Quick Links</h4>
          <ul>
            <li><a href="#/">Home</a></li>
            <li><a href="#/products">Shop All</a></li>
            <li><a href="#/cart">View Cart</a></li>
          </ul>
        </div>
        <div class="footer-contact">
          <h4>Contact Us</h4>
          <p>support@megamart.demo</p>
          <p>+91 90000 00009</p>
        </div>
      </div>
      <div class="footer-bottom">
        <p>
          &copy; <span id="current-year"></span> Mega Mart. All rights reserved.
        </p>
      </div>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
